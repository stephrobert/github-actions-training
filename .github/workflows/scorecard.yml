# Workflow OpenSSF Scorecard
# Analyse la sécurité du projet et publie les résultats
# https://github.com/ossf/scorecard-action

name: Scorecard Analysis

on:
  # Analyse sur push vers master
  push:
    branches: [master]
  # Analyse hebdomadaire
  schedule:
    - cron: "0 6 * * 1"
  # Possibilité de lancer manuellement
  workflow_dispatch:

# Permissions minimales
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write  # Pour uploader les résultats SARIF
      id-token: write         # Pour publier les résultats sur scorecard.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publier les résultats sur scorecard.dev (visible publiquement)
          publish_results: true

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
