# Workflow OpenSSF Scorecard
# Analyse la sécurité du projet et publie les résultats
# https://github.com/ossf/scorecard-action

name: Scorecard Analysis

on:
  # Analyse sur push vers main
  push:
    branches: [main]
  # Analyse hebdomadaire
  schedule:
    - cron: "0 6 * * 1"
  # Possibilité de lancer manuellement
  workflow_dispatch:

# Permissions minimales
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write  # Pour uploader les résultats SARIF
      id-token: write         # Pour publier les résultats sur scorecard.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publier les résultats sur scorecard.dev (visible publiquement)
          publish_results: true

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
