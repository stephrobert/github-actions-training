[project]
name = "github-actions-training"
version = "0.1.0"
description = "Labs vérifiables de la formation GitHub Actions du blog, joués avec act"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
# Ce dépôt n'est pas un package Python : c'est un catalogue de labs.
package = false

[tool.ruff]
# Jeu de règles repris à l'identique des catalogues frères (Kubernetes,
# Terraform, Linux) : un contributeur qui passe de l'un à l'autre ne doit pas
# réapprendre ce qui est accepté.
target-version = "py312"

# Ce que ruff ne touche JAMAIS, et pourquoi.
#
# `labs/*/fixtures/` est le point de départ que l'apprenant reçoit. Mesuré le
# 2026-09-25 : `ruff --fix` y a trié les imports d'un fichier de tests livré,
# c'est-à-dire modifié le sujet. Un lab pourra même livrer du Python fautif à
# dessein, et le lint du catalogue n'a pas à le corriger.
#
# `challenge/work` est le répertoire de travail, jamais versionné : ce que
# l'apprenant y écrit ne regarde pas le dépôt.
exclude = [
    "labs/*/fixtures",
    "labs/*/challenge/work",
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "I", "UP", "B", "BLE", "SIM", "RUF", "EXE", "DTZ", "PLE", "PLW", "S",
]
ignore = [
    # Les messages d'assertion enseignent ; les couper à 88 colonnes les
    # rendrait moins lisibles.
    "E501",
    # `assert` est le verbe de pytest.
    "S101",
    # Appeler act, zizmor ou pinact par leur nom depuis le PATH est le métier
    # de ce dépôt : c'est ainsi que l'apprenant les appelle.
    "S603", "S607",
]

[tool.pytest.ini_options]
# Le contrat dsoxlab impose que chaque lab nomme son test
# challenge/tests/test_functional.py. Tous ces fichiers partagent le même
# basename dans des répertoires sans __init__.py : le mode d'import « prepend »
# les prendrait pour un seul module. importlib les isole par leur chemin.
addopts = "--import-mode=importlib -p no:cacheprovider"

# Ne collecter QUE les tests des challenges. Le point de départ d'un lab
# (`fixtures/`, copié dans `challenge/work`) porte souvent ses propres tests,
# ceux de l'application à intégrer : ils tournent DANS le workflow, sous act,
# jamais ici. Les tests du catalogue (tests/) se lancent explicitement.
testpaths = ["labs"]
norecursedirs = [
    "fixtures", "work", "solution", ".git", ".venv", "__pycache__",
]
